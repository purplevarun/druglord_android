name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the vendored agent skills
        run: python3 scripts/sync_agent_skills.py --check

      - name: Test and build the release APK
        run: ./gradlew test :app:assembleRelease --console=plain

      - name: Report APK size
        run: ls -l app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
